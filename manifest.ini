[ABOUT]
NAME = Millenium HUD
AUTHOR = Millenium
VERSION = 2.0.0
DESCRIPTION = Glass-HUD в стилистике Hyprland для Assetto Corsa: плавающие острова-стёкла, радар машин, телеметрия (шины, топливо, сессия, повреждения). Hello from Spotik.
REQUIRED_VERSION = 0

[CORE]
; NONE: скрипт грузится вместе с игрой и HUD рисуется всегда,
; даже если окно настроек ни разу не открывалось.
LAZY = NONE

[WINDOW_...]
ID = main
NAME = Millenium HUD
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 400, 560
MIN_SIZE = 340, 420
PADDING = 12, 10

[UI_CALLBACKS]
; Полноэкранный прозрачный канвас: острова HUD + режим редактирования
IN_GAME = drawHud
